# Production stack for your own server, designed for Portainer (Stacks -> Add stack: Repository, or the Web editor with
# this file pasted in) but equally happy under plain `docker compose up -d`. Settings come from ${VARIABLES}: in
# Portainer, enter them in the stack's "Environment variables" section; with the CLI, put them in a .env file next to
# this file (copy .env.example). You MUST set SECRET_KEY and DB_PASSWORD; everything else has a default.
# This file loads even when no variables are set; the app then refuses to start and says exactly what is missing.
#
# The app image is built by GitHub Actions and pulled from ghcr.io (see ../.github/workflows/docker.yml).
# Database migrations run automatically inside the web container every time it starts, so an upgrade is just
# "pull the new image and redeploy".
#
# The web container publishes WEB_PORT (default 2255) on WEB_BIND (default 127.0.0.1, this machine only). A Cloudflare
# Tunnel forwards your public hostname to it. Set WEB_BIND to this machine's LAN IP (or 0.0.0.0) when the tunnel
# runs on another machine, e.g. a tunnel public hostname with service  http://10.10.10.59:2255
#
# Optional bundled ingress (COMPOSE_PROFILES, leave empty if you already run your own cloudflared):
#   tunnel   A cloudflared container in this stack (needs TUNNEL_TOKEN); point the public hostname at http://web:8000
#   caddy    Caddy on ports 80/443 with a free Let's Encrypt certificate, for a server reachable from the internet
name: markdownpost

x-app: &app
  image: ${MARKDOWNPOST_IMAGE:-ghcr.io/jamesduffy/markdownpost.com:latest}
  environment: &env
    # Fixed for production: nothing you enter can accidentally turn these off.
    DEBUG: "0"
    TRUST_PROXY: "1" # a proxy (Cloudflare / Caddy) terminates TLS: enables the HTTPS redirect, secure cookies and HSTS
    DB_HOST: db
    # Required (no safe default): the web container exits with a clear message if either is empty
    SECRET_KEY: ${SECRET_KEY:-}
    DB_PASSWORD: ${DB_PASSWORD:-}
    # Derived from DOMAIN unless you set them
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${DOMAIN:-www.markdownpost.com}}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://${DOMAIN:-www.markdownpost.com}}
    # Have defaults here
    DB_NAME: ${DB_NAME:-markdownpost}
    DB_USER: ${DB_USER:-markdownpost}
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
    CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-} # CF-Connecting-IP when using the Cloudflare Tunnel

    # Optional: passed to the app only when you set them (otherwise the app's own defaults apply)
    EMAIL_BACKEND:
    EMAIL_HOST:
    EMAIL_PORT:
    EMAIL_HOST_USER:
    EMAIL_HOST_PASSWORD:
    EMAIL_USE_TLS:
    EMAIL_USE_SSL:
    DEFAULT_FROM_EMAIL:
    S3_ENDPOINT_URL:
    S3_BUCKET:
    S3_REGION:
    S3_ACCESS_KEY:
    S3_SECRET_KEY:
    LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/storage} # must be the volume mount below, or post bodies and images vanish on every redeploy
    TURNSTILE_SITE_KEY:
    TURNSTILE_SECRET_KEY:
    SENTRY_DSN:
    SENTRY_ENVIRONMENT:
    SENTRY_TRACES_SAMPLE_RATE:
    HSTS_SECONDS:
    HSTS_INCLUDE_SUBDOMAINS:
    HSTS_PRELOAD:
    CSP_ENFORCE:
    LOG_LEVEL:
    LOGIN_LIMIT_PER_IP:
    LOGIN_LIMIT_PER_USER:
    LOGIN_LIMIT_WINDOW:
    SIGNUP_LIMIT:
    SIGNUP_LIMIT_WINDOW:
    RESET_LIMIT:
    RESET_LIMIT_WINDOW:
    UPLOAD_QUOTA_BYTES:
    UPLOAD_RATE_LIMIT:
    MCP_REQUESTS_PER_MINUTE:
    MCP_POSTS_PER_HOUR:
    MCP_UPDATES_PER_HOUR:
    POST_VERSIONS_KEEP:
    POST_VERSION_MIN_INTERVAL_SECONDS:
    SCHEDULE_MAX_DAYS:
    HELPFUL_HALF_LIFE_DAYS:
    HELPFUL_LIMIT_PER_HOUR:
    HELPFUL_REQUIRE_VERIFIED_EMAIL:
    HELPFUL_MIN_ACCOUNT_AGE_DAYS:
    FOLLOW_LIMIT_PER_HOUR:
    FOLLOW_MAX_PER_ACCOUNT:
    DISCOVERABLE_MIN_ACCOUNT_AGE_DAYS:
    DISCOVERABLE_REQUIRE_VERIFIED_EMAIL:
    PUBLISH_REQUIRE_VERIFIED_EMAIL:
    PUBLISH_EXEMPT_AGENTS:
    TAG_MIN_POSTS:
    CARD_GENERATIONS_PER_HOUR:
    EXPORT_RATE_LIMIT:
    EXPORT_MAX_BYTES:
    EXPORT_MAX_SECONDS:
    REPLIES_ENABLED:
    REPLIES_MAX_CHARS:
    REPLIES_LIMIT_PER_HOUR:
    REPLIES_LIMIT_PER_DAY:
    REPLIES_LIMIT_PER_IP_HOUR:
    REPLIES_MAX_PER_POST_PER_DAY:
    REPLIES_LINKS_MIN_ACCOUNT_AGE_DAYS:
    REPLIES_MAX_SHOWN:
    CONTACT_EMAIL:
    CONTACT_LIMIT:
    CONTACT_LIMIT_WINDOW:
    REPORT_LIMIT:
    REPORT_LIMIT_WINDOW:

services:
  web:
    <<: *app
    environment:
      <<: *env
      RUN_MIGRATIONS: "1" # the entrypoint applies pending migrations (under a database lock) before gunicorn starts
    ports:
      # Plain HTTP for the tunnel/proxy only. Keep it on a trusted network (WEB_BIND) and don't forward it to the internet.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-2255}:8000"
    volumes:
      - storage:/data/storage # post bodies and images when STORAGE_BACKEND=local
    healthcheck:
      # /health/ answers 200 with the running git version when gunicorn, Django and the database are all up. It asks
      # like the proxy does (the site's own hostname, as https) so Django doesn't log a rejected-host error every 30 s.
      test: ["CMD", "python", "-c", "import os,http.client as h; c=h.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health/',headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}); raise SystemExit(c.getresponse().status!=200)"]
      interval: 30s
      timeout: 5s
      start_period: 90s # first start after an upgrade includes running migrations
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Publishes scheduled posts (the editor's Schedule menu, MCP publish_at) when their time comes, checking every minute.
  # Pages also publish due posts when opened, so a stopped scheduler delays rather than loses them.
  scheduler:
    <<: *app
    command: ["python", "manage.py", "publish_scheduled", "--every", "60"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Housekeeping: removes uploaded images that no post uses any more (see the README). Waits a couple of
  # minutes after (re)start so it never touches the database while a fresh web container is migrating it.
  # sweeper:
  #   <<: *app
  #   command: ["sh", "-c", "sleep 120; while true; do python manage.py sweep_uploads --hours ${SWEEP_MIN_AGE_HOURS:-24}; sleep $$((${SWEEP_INTERVAL_HOURS:-24} * 3600)); done"]
  #   volumes:
  #     - storage:/data/storage
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-markdownpost}
      POSTGRES_USER: ${DB_USER:-markdownpost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-} # empty: Postgres refuses to initialise and says so in its log
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-markdownpost} -d ${DB_NAME:-markdownpost}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  pgdata:
  caddy_data:
  caddy_config:
