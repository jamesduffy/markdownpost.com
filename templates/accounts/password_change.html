{% extends "accounts/settings_base.html" %}
{% block title %}Change password{% endblock %}
{% block panel %}
  <form method="post" class="settings-form">
    {% csrf_token %}
    <section class="field-group">
      <h2>Change password</h2>
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>{{ field.label }} {{ field }}
          {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
          {{ field.errors }}
        </label>
      {% endfor %}
      <div class="form-actions"><button class="btn" type="submit">Change password</button><a class="quiet-link" href="{% url 'settings_account' %}">Cancel</a></div>
    </section>
  </form>
{% endblock %}
