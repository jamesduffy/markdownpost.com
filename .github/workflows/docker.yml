# Tests the app, then builds the Docker image and publishes it to GitHub Container Registry (ghcr.io).
#
#   push to main      -> ghcr.io/<owner>/<repo>:latest and :<short sha>
#   push tag v1.2.3   -> also :1.2.3 and :1.2
#   pull request      -> tests + a build, nothing is pushed (so forks and PRs can't publish anything)
#
# No secrets to configure: it signs in to ghcr.io with the built-in GITHUB_TOKEN.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image (same Dockerfile, with the dev requirements)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: markdownpost-test
          build-args: INSTALL_DEV=1
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - name: Run the Django test suite
        run: docker run --rm -e SECRET_KEY=ci-only markdownpost-test python manage.py test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # lets one runner build the arm64 image too
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Pull requests only build amd64 (arm64 under emulation is slow); real publishes cover both.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }} # includes org.opencontainers.image.source, which links the package to this repo
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
