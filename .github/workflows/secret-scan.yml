# Scans the whole git history for secrets on every push and pull request. This repository is public, so a leaked
# key would be harvested within minutes: this catches one early (rotate it if it ever fires; deleting a commit
# doesn't un-leak it). Also enable GitHub's own "Secret scanning" and "Push protection" in
# Settings -> Code security, which is free for public repositories.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history, not just the latest commit
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
